[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "veriq-quantum"
dynamic = ["version"]
description = "A neutral truth layer for AI-written quantum code: formal equivalence, transpile integrity and statistical checks."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yosef Noorani" }]
keywords = ["quantum", "qiskit", "verification", "equivalence-checking", "llm", "ai-generated-code", "pytest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: Pytest",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "qiskit>=2.6.1,<3",
  "qiskit-aer>=0.18.2",
  "mqt.qcec>=3.11,<4",
  "qiskit-qasm3-import>=0.6",
  "scipy>=1.11",
  "numpy>=1.26",
  "pyyaml>=6",
  "cryptography>=42",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
scale = ["matplotlib>=3.8", "psutil>=5.9"]
preflight = ["qiskit-ibm-runtime==0.51.0"]
cirq = ["cirq-core>=1.4", "ply>=3.11"]   # ply: cirq.contrib.qasm_import
tket = ["pytket>=2.0", "pytket-qiskit>=0.70"]
qasm3 = ["qiskit-qasm3-import>=0.6"]
dev = ["pytest>=8", "mcp>=2.3,<3", "matplotlib>=3.8", "psutil>=5.9", "qiskit-ibm-runtime==0.51.0",
       "cirq-core>=1.4", "pytket>=2.0", "pytket-qiskit>=0.70", "pillow>=10"]   # pillow: demo/render_demo.py

[project.urls]
Homepage = "https://github.com/Yosefnoorani/veriq"
Source = "https://github.com/Yosefnoorani/veriq"
Issues = "https://github.com/Yosefnoorani/veriq/issues"
Documentation = "https://github.com/Yosefnoorani/veriq/tree/main/docs"

[project.entry-points.pytest11]
veriq = "veriq.pytest_plugin"

[project.scripts]
veriq = "veriq.cli:main"
veriq-mcp = "veriq.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "veriq.__version__" }

[tool.setuptools.package-data]
veriq = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running scale tests (deselect with -m 'not slow')"]
