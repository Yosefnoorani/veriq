[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veriq"
version = "0.1.0"
description = "A neutral truth layer for AI-written quantum code: formal equivalence, transpile integrity and statistical checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "qiskit==2.6.1",
  "qiskit-aer==0.18.2",
  "mqt.qcec==3.11.0",
  "qiskit-qasm3-import>=0.6",
  "scipy>=1.11",
  "numpy>=1.26",
  "pyyaml>=6",
  "cryptography>=42",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
scale = ["matplotlib>=3.8", "psutil>=5.9"]
preflight = ["qiskit-ibm-runtime==0.51.0"]
cirq = ["cirq-core>=1.4", "ply>=3.11"]   # ply: cirq.contrib.qasm_import
tket = ["pytket>=2.0", "pytket-qiskit>=0.70"]
qasm3 = ["qiskit-qasm3-import>=0.6"]
dev = ["pytest>=8", "mcp>=2.3,<3", "matplotlib>=3.8", "psutil>=5.9", "qiskit-ibm-runtime==0.51.0",
       "cirq-core>=1.4", "pytket>=2.0", "pytket-qiskit>=0.70"]

[project.scripts]
veriq = "veriq.cli:main"
veriq-mcp = "veriq.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veriq = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running scale tests (deselect with -m 'not slow')"]
